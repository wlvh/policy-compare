name: Independent engines
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixture-construction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r validation/requirements.txt
      - run: python validation/fixture_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-construction-only
          path: validation/dataset/fixture_check_report.json
  renewal-triage-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -p 'test_renewal_triage.py' -v
  # Independent checks keep running after another check fails, once their prerequisites (install,
  # build, browser download) succeeded; each failed step still fails the job. One engine's failure
  # does not cancel the other.
  functional:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [pdfjs, mupdf]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.12.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24.19.0}
      - name: Record runner and source provenance
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          mkdir -p reports
          node --input-type=module -e 'import fs from "node:fs"; import os from "node:os"; fs.writeFileSync(`reports/ci-environment-${process.env.ENGINE}.json`, JSON.stringify({commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,engine:process.env.ENGINE,node:process.version,platform:process.platform,arch:process.arch,cpu:os.cpus()[0].model,memoryBytes:os.totalmem(),purpose:"functional checks only; not target-device performance acceptance"},null,2)+"\n")'
      - run: rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - id: engine
        run: pnpm install:${{ matrix.engine }}
      - if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        run: pnpm verify:core
      - if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        run: pnpm exec tsx scripts/issue19-parity.ts
      - id: build
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        run: pnpm build:${{ matrix.engine }}
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec tsx scripts/pdf-check.ts ${{ matrix.engine }}
      # Exit 2 means the only open items are registered coverage gaps (strict status NOT_EVALUATED, see the log and rules report).
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:rules:${{ matrix.engine }} || test $? -eq 2
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec tsx scripts/review-check.ts ${{ matrix.engine }}
      - id: browsers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: pnpm test:browser:${{ matrix.engine }}
        env:
          POLICY_BROWSER_CHANNEL: bundled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.engine }}
          path: |
            reports/ci-environment-${{ matrix.engine }}.json
            reports/core-tests.json
            reports/english-ui/parity.json
            reports/cross-entry-${{ matrix.engine }}.json
            reports/pdf-checks-${{ matrix.engine }}.json
            reports/rules-${{ matrix.engine }}.json
            reports/review-regressions-${{ matrix.engine }}.json
            reports/browser-review-regressions-${{ matrix.engine }}.json
            reports/browser-tests-${{ matrix.engine }}.json
            reports/browser-rules-${{ matrix.engine }}.json
            reports/cancellation-${{ matrix.engine }}.json
            reports/browser-review-${{ matrix.engine }}.png
            reports/rotated-location-${{ matrix.engine }}.png
            test-results/${{ matrix.engine }}/
  linux-container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [pdfjs, mupdf]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.12.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24.19.0}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and start the selected Linux image
        id: candidate
        run: pnpm test:container ${{ matrix.engine }}
        env:
          POLICY_BROWSER_CHANNEL: bundled
      - name: Check the same-image preview entry
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        env:
          POLICY_PREVIEW_REPORT_DIR: ${{ github.workspace }}/reports/local-deploy/preview-${{ matrix.engine }}
        run: |
          candidate="$(node -p "require('./reports/container-${{ matrix.engine }}.json').evidence")"
          pnpm preview:release "$candidate" 8088
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir = process.env.POLICY_PREVIEW_REPORT_DIR;
          const preview = JSON.parse(fs.readFileSync(`${dir}/preview.json`, 'utf8'));
          const manual = JSON.parse(fs.readFileSync(`${dir}/manual-review.json`, 'utf8'));
          if (preview.status !== 'READY_FOR_MANUAL_REVIEW' || preview.manualReview !== 'NOT_EVALUATED' ||
              manual.status !== 'NOT_EVALUATED' || !manual.checks.length ||
              manual.checks.some(check => check.status !== 'NOT_EVALUATED')) {
            throw new Error('Preview startup must not imply human acceptance');
          }
          NODE
      - name: Remove the CI preview container
        if: always()
        run: |
          record="reports/local-deploy/preview-${{ matrix.engine }}/preview.json"
          if test -f "$record"; then
            name="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).containerName' "$record")"
            if docker container inspect "$name" >/dev/null 2>&1; then
              docker rm -f "$name"
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-container-${{ matrix.engine }}
          path: |
            reports/container-${{ matrix.engine }}.json
            reports/container-build-${{ matrix.engine }}.log
            reports/local-deploy/

  scroll-baseline-evidence:
    # Frozen-source investigation for this review, not a gate on future Rust work.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 10.12.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24.19.0}
      - run: rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: pnpm install:pdfjs
      - run: pnpm build:core
      - run: pnpm exec playwright install --with-deps chromium
      # Collect both outcomes; an old failing case is not changed to PASS.
      # The independent functional/container jobs remain product gates.
      - run: pnpm exec tsx scripts/review20-scroll-comparison.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scroll-baseline-evidence
          path: reports/issue-19/review-followup/scroll-comparison/
